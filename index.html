<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b5d6b">
<title>Walking Around the World</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>🧳 Walking Around the World</h1>
    </header>

    <main>
      <section class="passport-card">
        <span class="lap-badge" id="lap-badge">1周目</span>
        <div class="current-city">
          <span class="flag" id="current-flag">🇯🇵</span>
          <div>
            <div class="city-name" id="current-city-name">宮崎</div>
            <div class="city-country" id="current-city-country">日本</div>
          </div>
        </div>

        <div class="progress-wrap">
          <div class="progress-label">
            <span id="next-city-label">次の都市: 台北まで</span>
            <span id="progress-numbers">0 / 8000 歩</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        </div>
      </section>

      <section class="stats-row">
        <div class="stat-box">
          <div class="stat-value" id="today-steps">0</div>
          <div class="stat-label">今日の歩数</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="total-steps">0</div>
          <div class="stat-label">累計歩数</div>
        </div>
      </section>

      <section class="controls">
        <button id="next-lap-btn" class="btn primary" hidden>🌏 2周目を始める</button>
        <p id="sync-badge" class="sync-badge">📲 未同期(手動カウント中)</p>
        <div class="health-input-row">
          <label class="health-label">📦 進捗を引き継ぐ</label>
          <div class="health-row">
            <input type="number" id="migrate-input" placeholder="累計歩数を入力 例: 199990" inputmode="numeric" min="0">
            <button id="migrate-btn" class="btn secondary small">設定</button>
          </div>
        </div>
        <div class="health-input-row">
          <label class="health-label">🍎 今日の歩数を入力</label>
          <div class="health-row">
            <input type="number" id="health-input" placeholder="例: 8432" inputmode="numeric" min="0">
            <button id="health-submit-btn" class="btn primary small">反映</button>
          </div>
        </div>
        <button id="enable-sensor-btn" class="btn primary">📡 歩数センサーを有効にする</button>
        <button id="manual-step-btn" class="btn secondary">👟 手動で歩数を追加(+100歩)</button>
        <p class="hint" id="sensor-status">センサー: 未使用(手動カウント中)</p>
      </section>

      <section class="map-section">
        <h2>🗺 世界地図</h2>
        <div id="map-container" class="map-container">
          <svg id="world-map-svg" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
      </section>

      <section class="visited">
        <h2>📍 これまで訪れた都市</h2>
        <ul id="visited-list" class="visited-list"></ul>
      </section>
    </main>
  </div>

  <!-- 地図ポップアップ -->
  <div class="map-popup" id="map-popup">
    <div class="map-popup-card">
      <button id="popup-close-btn" class="popup-close">✕</button>
      <div class="popup-header">
        <span class="flag" id="popup-flag">🌍</span>
        <div>
          <div class="city-name" id="popup-name"></div>
          <div class="city-country" id="popup-country"></div>
        </div>
      </div>
      <div id="popup-info"></div>
    </div>
  </div>

  <!-- 到着演出モーダル -->
  <div class="modal-overlay" id="arrival-modal">
    <div class="modal-card">
      <div class="stamp">🛂 到着スタンプ</div>
      <div class="flag big" id="arrival-flag">🌍</div>
      <h2 id="arrival-city-name">City</h2>
      <p class="arrival-country" id="arrival-country">Country</p>

      <div id="arrival-info"></div>

      <button id="close-modal-btn" class="btn primary">旅を続ける</button>
    </div>
  </div>

  <script src="cities.js"></script>
  <script src="costumes.js"></script>
  <script src="map.js"></script>
  <script src="app.js"></script>
</body>
</html>
